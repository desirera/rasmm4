<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RA SMM Admin</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#070910;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{margin-bottom:5px}

.subtitle{
    color:#8991a5;
    margin-bottom:25px;
}

.card{
    background:#10131d;
    border:1px solid #252a38;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:14px;
    margin-top:8px;
    margin-bottom:12px;
    background:#080b12;
    border:1px solid #303646;
    border-radius:12px;
    color:#fff;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#e93676,#8d4cff);
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

button:active{opacity:.8}

.stat{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:15px;
}

.stat div{
    background:#0c1018;
    border:1px solid #252a38;
    border-radius:15px;
    padding:18px;
}

.stat span{
    display:block;
    color:#8991a5;
    font-size:13px;
    margin-bottom:8px;
}

.stat strong{font-size:24px}

#result,
#depositResult{
    margin-top:15px;
    color:#5ee7ff;
    word-break:break-word;
}

.payment{
    background:#0c1018;
    border:1px solid #252a38;
    border-radius:15px;
    padding:16px;
    margin-top:12px;
}

.payment div{
    margin-bottom:8px;
    word-break:break-all;
}

.payment b{
    color:#5ee7ff;
}

.payment button{
    margin-top:8px;
}

.reject{
    background:#8b2638;
}

.empty{
    color:#8991a5;
    text-align:center;
    padding:20px;
}

@media(max-width:600px){
    .stat{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>RA SMM ADMIN</h1>
    <div class="subtitle">Yönetim paneli</div>

    <div class="stat">

        <div>
            <span>SİSTEM</span>
            <strong>LIVE</strong>
        </div>

        <div>
            <span>AĞ</span>
            <strong>BEP-20</strong>
        </div>

        <div>
            <span>PARA BİRİMİ</span>
            <strong>USDT</strong>
        </div>

    </div>


    <!-- BAKİYE EKLE -->

    <div class="card">

        <h2>Kullanıcı İşlemleri</h2>

        <label>Telegram ID</label>

        <input
            id="telegramId"
            type="number"
            placeholder="Telegram ID"
        >

        <label>Bakiye İşlemi</label>

        <input
            id="amount"
            type="number"
            step="0.01"
            placeholder="USDT miktarı"
        >

        <button onclick="addBalance()">
            BAKİYE EKLE
        </button>

        <div id="result"></div>

    </div>


    <!-- ÖDEME BİLDİRİMLERİ -->

    <div class="card">

        <h2>💳 Bekleyen Ödemeler</h2>

        <button onclick="loadDeposits()">
            ÖDEMELERİ YENİLE
        </button>

        <div id="deposits">
            <div class="empty">
                Ödemeler yükleniyor...
            </div>
        </div>

    </div>

</div>


<script>

const API = "https://rasmm4-api.onrender.com";


/* =========================
   BAKİYE EKLE
========================= */

async function addBalance(){

    const telegramId =
        document.getElementById("telegramId").value;

    const amount =
        document.getElementById("amount").value;

    if(!telegramId || !amount){

        document.getElementById("result").innerText =
            "Telegram ID ve miktar gerekli.";

        return;
    }

    const adminKey = prompt("Admin anahtarını gir:");

    if(!adminKey){

        document.getElementById("result").innerText =
            "İşlem iptal edildi.";

        return;
    }

    document.getElementById("result").innerText =
        "İşlem yapılıyor...";

    try{

        const response = await fetch(
            API + "/api/admin/balance",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "X-Admin-Key":adminKey
                },

                body:JSON.stringify({
                    telegram_id:telegramId,
                    amount:amount
                })
            }
        );

        const data = await response.json();

        if(!response.ok || !data.success){

            document.getElementById("result").innerText =
                "Hata: " +
                (data.error || "Bakiye eklenemedi.");

            return;
        }

        document.getElementById("result").innerText =
            "✅ Bakiye eklendi. Yeni bakiye: " +
            Number(data.balance).toFixed(2) +
            " USDT";

    }catch(error){

        document.getElementById("result").innerText =
            "Sunucu bağlantı hatası.";

    }

}


/* =========================
   ÖDEMELERİ GETİR
========================= */

async function loadDeposits(){

    const box =
        document.getElementById("deposits");

    const adminKey =
        prompt("Admin anahtarını gir:");

    if(!adminKey){

        box.innerHTML =
            '<div class="empty">İşlem iptal edildi.</div>';

        return;
    }

    box.innerHTML =
        '<div class="empty">Ödemeler yükleniyor...</div>';

    try{

        const response = await fetch(
            API + "/api/admin/deposits",
            {
                method:"GET",

                headers:{
                    "X-Admin-Key":adminKey
                }
            }
        );

        const data = await response.json();

        if(!response.ok){

            box.innerHTML =
                '<div class="empty">Hata: ' +
                (data.error || "Ödemeler alınamadı.") +
                '</div>';

            return;
        }

        if(!data.length){

            box.innerHTML =
                '<div class="empty">' +
                'Bekleyen ödeme bulunmuyor.' +
                '</div>';

            return;
        }

        box.innerHTML = "";

        data.forEach(payment => {

            const div =
                document.createElement("div");

            div.className = "payment";

            div.innerHTML = `

                <div>
                    👤 <b>Telegram ID:</b>
                    ${payment.telegram_id}
                </div>

                <div>
                    💵 <b>Miktar:</b>
                    ${Number(payment.amount).toFixed(2)} USDT
                </div>

                <div>
                    🔗 <b>TXID:</b>
                    ${payment.txid}
                </div>

                <div>
                    🕐 <b>Tarih:</b>
                    ${payment.created_at || "-"}
                </div>

                <div>
                    📌 <b>Durum:</b>
                    ${payment.status}
                </div>

                <button
                    onclick="approveDeposit(${payment.id})"
                >
                    ✅ ÖDEMEYİ ONAYLA
                </button>

                <button
                    class="reject"
                    onclick="rejectDeposit(${payment.id})"
                >
                    ❌ REDDET
                </button>
            `;

            box.appendChild(div);

        });

    }catch(error){

        box.innerHTML =
            '<div class="empty">' +
            'Sunucu bağlantı hatası.' +
            '</div>';

    }

}


/* =========================
   ÖDEME ONAYLA
========================= */

async function approveDeposit(id){

    const adminKey =
        prompt("Admin anahtarını gir:");

    if(!adminKey) return;

    try{

        const response = await fetch(
            API + "/api/admin/deposit/" + id + "/approve",
            {
                method:"POST",

                headers:{
                    "X-Admin-Key":adminKey
                }
            }
        );

        const data = await response.json();

        if(!response.ok || !data.success){

            alert(
                "Hata: " +
                (data.error || "Ödeme onaylanamadı.")
            );

            return;
        }

        alert(
            "✅ Ödeme onaylandı.\n\n" +
            "Yeni bakiye: " +
            Number(data.balance).toFixed(2) +
            " USDT"
        );

        loadDeposits();

    }catch(error){

        alert("Sunucu bağlantı hatası.");

    }

}


/* =========================
   ÖDEME REDDET
========================= */

async function rejectDeposit(id){

    const adminKey =
        prompt("Admin anahtarını gir:");

    if(!adminKey) return;

    try{

        const response = await fetch(
            API + "/api/admin/deposit/" + id + "/reject",
            {
                method:"POST",

                headers:{
                    "X-Admin-Key":adminKey
                }
            }
        );

        const data = await response.json();

        if(!response.ok || !data.success){

            alert(
                "Hata: " +
                (data.error || "Ödeme reddedilemedi.")
            );

            return;
        }

        alert("❌ Ödeme reddedildi.");

        loadDeposits();

    }catch(error){

        alert("Sunucu bağlantı hatası.");

    }

}


/* Sayfa açılınca ödemeleri çek */

loadDeposits();

</script>

</body>
</html>
