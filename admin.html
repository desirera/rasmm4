<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RA SMM Admin</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#070910;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

h1{
    margin-bottom:5px;
}

.subtitle{
    color:#8991a5;
    margin-bottom:25px;
}

.card{
    background:#10131d;
    border:1px solid #252a38;
    border-radius:18px;
    padding:20px;
    margin-bottom:15px;
}

input{
    width:100%;
    padding:14px;
    margin-top:8px;
    margin-bottom:12px;
    background:#080b12;
    border:1px solid #303646;
    border-radius:12px;
    color:#fff;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#e93676,#8d4cff);
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

button:active{
    opacity:.8;
}

.stat{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:15px;
}

.stat div{
    background:#0c1018;
    border:1px solid #252a38;
    border-radius:15px;
    padding:18px;
}

.stat span{
    display:block;
    color:#8991a5;
    font-size:13px;
    margin-bottom:8px;
}

.stat strong{
    font-size:24px;
}

#result{
    margin-top:15px;
    color:#5ee7ff;
    word-break:break-word;
}

/* ÖDEME */
.payment-item{
    background:#080b12;
    border:1px solid #292f40;
    border-radius:14px;
    padding:16px;
    margin-top:12px;
}

.payment-item div{
    margin-bottom:7px;
    word-break:break-word;
}

.payment-label{
    color:#8991a5;
    font-size:12px;
}

.payment-value{
    color:#fff;
    font-weight:bold;
}

.payment-status{
    color:#ffd166;
    font-weight:bold;
}

.payment-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px;
}

.payment-buttons button{
    margin:0;
}

.approve{
    background:linear-gradient(90deg,#12b76a,#20c997);
}

.reject{
    background:linear-gradient(90deg,#e93676,#b42318);
}

.empty{
    text-align:center;
    color:#8991a5;
    padding:20px 5px;
}

.error{
    color:#ff6b7a;
}

.success{
    color:#55e6a5;
}


/* SİPARİŞLER */
.order-item{
    background:#080b12;
    border:1px solid #292f40;
    border-radius:14px;
    padding:16px;
    margin-top:12px;
}
.order-item div{margin-bottom:7px;word-break:break-word;}
.order-label{color:#8991a5;font-size:12px;}
.order-value{color:#fff;font-weight:bold;}
.order-status{color:#5ee7ff;font-weight:bold;}
.order-status-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
.order-status-buttons button{margin:0;padding:11px 8px;font-size:12px;}
.status-processing{background:linear-gradient(90deg,#8d4cff,#5e5ce6);}
.status-done{background:linear-gradient(90deg,#12b76a,#20c997);}
.status-cancel{background:linear-gradient(90deg,#e93676,#b42318);}

@media(max-width:600px){

    body{
        padding:14px;
    }

    .stat{
        grid-template-columns:1fr;
    }

    .payment-buttons{
        grid-template-columns:1fr;
    }

    .order-status-buttons{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>RA SMM ADMIN</h1>

    <div class="subtitle">
        Yönetim paneli
    </div>


    <!-- DURUM -->

    <div class="stat">

        <div>
            <span>SİSTEM</span>
            <strong>LIVE</strong>
        </div>

        <div>
            <span>AĞ</span>
            <strong>BEP-20</strong>
        </div>

        <div>
            <span>PARA BİRİMİ</span>
            <strong>USDT</strong>
        </div>

    </div>


    <!-- BAKİYE -->

    <div class="card">

        <h2>Kullanıcı İşlemleri</h2>

        <label>Telegram ID</label>

        <input
            id="telegramId"
            type="number"
            placeholder="Telegram ID"
        >


        <label>Bakiye İşlemi</label>

        <input
            id="amount"
            type="number"
            step="0.01"
            placeholder="USDT miktarı"
        >


        <button onclick="addBalance()">
            BAKİYE EKLE
        </button>

        <button onclick="removeBalance()">
            BAKİYE SİL
        </button>


        <div id="result"></div>

    </div>


    <!-- BEKLEYEN ÖDEMELER -->

    <div class="card">

        <h2>💳 Bekleyen Ödemeler</h2>

        <button onclick="loadPayments()">
            ÖDEMELERİ YENİLE
        </button>

        <div id="payments">

            <div class="empty">
                Ödemeleri görmek için yenile butonuna bas.
            </div>

        </div>

    </div>


    <!-- SİPARİŞLER -->

    <div class="card">
        <h2>📦 SMM Siparişleri</h2>
        <button onclick="loadOrders()">SİPARİŞLERİ YENİLE</button>
        <div id="orders">
            <div class="empty">Siparişleri görmek için yenile butonuna bas.</div>
        </div>
    </div>

</div>


<script>

const API = "https://rasmm4-api.onrender.com";

let adminKey = sessionStorage.getItem("ra_admin_key") || "";


/* =========================
   ADMIN ANAHTARI
========================= */

function getAdminKey(){

    if(adminKey){
        return adminKey;
    }

    const key = prompt("Admin anahtarını gir:");

    if(!key){
        return null;
    }

    adminKey = key;

    sessionStorage.setItem(
        "ra_admin_key",
        adminKey
    );

    return adminKey;
}


/* =========================
   BAKİYE EKLE
========================= */

async function addBalance(){

    const telegramId =
        document.getElementById("telegramId").value;

    const amount =
        document.getElementById("amount").value;

    const result =
        document.getElementById("result");


    if(!telegramId || !amount){

        result.innerText =
            "Telegram ID ve miktar gerekli.";

        result.className = "error";

        return;
    }


    const key = getAdminKey();

    if(!key){

        result.innerText =
            "İşlem iptal edildi.";

        return;
    }


    result.innerText =
        "İşlem hazırlanıyor...";

    result.className = "";


    try{

        const response = await fetch(
            API + "/api/admin/balance",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "X-Admin-Key":key
                },

                body:JSON.stringify({
                    telegram_id:telegramId,
                    amount:amount
                })
            }
        );


        const data =
            await response.json();


        if(response.status === 403){

            sessionStorage.removeItem(
                "ra_admin_key"
            );

            adminKey = "";

            result.innerText =
                "Admin anahtarı yanlış.";

            result.className = "error";

            return;
        }


        if(!response.ok || !data.success){

            result.innerText =
                "Hata: " +
                (data.error ||
                "Bakiye eklenemedi.");

            result.className = "error";

            return;
        }


        result.innerText =
            "Bakiye eklendi. Yeni bakiye: " +
            Number(data.balance).toFixed(2) +
            " USDT";

        result.className = "success";


    }catch(error){

        result.innerText =
            "Sunucu bağlantı hatası.";

        result.className = "error";
    }
}


/* =========================
   BAKİYE SİL
========================= */

async function removeBalance(){

    const telegramId =
        document.getElementById("telegramId").value;

    const amount =
        document.getElementById("amount").value;

    const result =
        document.getElementById("result");

    if(!telegramId || !amount){

        result.innerText =
            "Telegram ID ve miktar gerekli.";

        result.className = "error";

        return;
    }

    const key = getAdminKey();

    if(!key){

        result.innerText =
            "İşlem iptal edildi.";

        return;
    }

    if(!confirm(
        "Bu kullanıcının bakiyesinden " +
        Number(amount).toFixed(2) +
        " USDT silmek istiyor musun?"
    )){
        return;
    }

    result.innerText =
        "İşlem hazırlanıyor...";

    result.className = "";

    try{

        const response = await fetch(
            API + "/api/admin/balance/remove",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "X-Admin-Key":key
                },

                body:JSON.stringify({
                    telegram_id:telegramId,
                    amount:amount
                })
            }
        );

        const data =
            await response.json();

        if(response.status === 403){

            sessionStorage.removeItem(
                "ra_admin_key"
            );

            adminKey = "";

            result.innerText =
                "Admin anahtarı yanlış.";

            result.className = "error";

            return;
        }

        if(!response.ok || !data.success){

            result.innerText =
                "Hata: " +
                (data.error ||
                "Bakiye silinemedi.");

            result.className = "error";

            return;
        }

        result.innerText =
            "Bakiye silindi. Yeni bakiye: " +
            Number(data.balance).toFixed(2) +
            " USDT";

        result.className = "success";

    }catch(error){

        result.innerText =
            "Sunucu bağlantı hatası.";

        result.className = "error";
    }
}


/* =========================
   ÖDEMELERİ GETİR
========================= */

async function loadPayments(){

    const box =
        document.getElementById("payments");


    const key = getAdminKey();

    if(!key){

        box.innerHTML =
            '<div class="empty error">' +
            'İşlem iptal edildi.' +
            '</div>';

        return;
    }


    box.innerHTML =
        '<div class="empty">Ödemeler yükleniyor...</div>';


    try{

        const response = await fetch(
            API + "/api/admin/payments",
            {
                method:"GET",

                headers:{
                    "X-Admin-Key":key
                }
            }
        );


        const data =
            await response.json();


        if(response.status === 403){

            sessionStorage.removeItem(
                "ra_admin_key"
            );

            adminKey = "";

            box.innerHTML =
                '<div class="empty error">' +
                'Admin anahtarı yanlış.' +
                '</div>';

            return;
        }


        if(!response.ok || !data.success){

            box.innerHTML =
                '<div class="empty error">' +
                (data.error ||
                "Ödemeler alınamadı.") +
                '</div>';

            return;
        }


        const payments =
            data.payments || [];


        if(payments.length === 0){

            box.innerHTML =
                '<div class="empty">' +
                'Henüz ödeme bildirimi yok.' +
                '</div>';

            return;
        }


        box.innerHTML =
            payments.map(payment => {

                let buttons = "";

                if(payment.status === "Bekliyor"){

                    buttons = `
                        <div class="payment-buttons">

                            <button
                                class="approve"
                                onclick="approvePayment(${payment.id})"
                            >
                                ✓ ONAYLA
                            </button>

                            <button
                                class="reject"
                                onclick="rejectPayment(${payment.id})"
                            >
                                ✕ REDDET
                            </button>

                        </div>
                    `;
                }


                return `

                    <div class="payment-item">

                        <div>
                            <div class="payment-label">
                                ÖDEME ID
                            </div>

                            <div class="payment-value">
                                #${payment.id}
                            </div>
                        </div>


                        <div>
                            <div class="payment-label">
                                TELEGRAM ID
                            </div>

                            <div class="payment-value">
                                ${payment.telegram_id}
                            </div>
                        </div>


                        <div>
                            <div class="payment-label">
                                TUTAR
                            </div>

                            <div class="payment-value">
                                ${Number(payment.amount).toFixed(2)} USDT
                            </div>
                        </div>


                        <div>
                            <div class="payment-label">
                                TXID
                            </div>

                            <div class="payment-value">
                                ${payment.txid}
                            </div>
                        </div>


                        <div>
                            <div class="payment-label">
                                TARİH
                            </div>

                            <div class="payment-value">
                                ${payment.created_at || "-"}
                            </div>
                        </div>


                        <div>
                            <div class="payment-label">
                                DURUM
                            </div>

                            <div class="payment-status">
                                ${payment.status}
                            </div>
                        </div>


                        ${buttons}

                    </div>

                `;

            }).join("");


    }catch(error){

        box.innerHTML =
            '<div class="empty error">' +
            'Sunucu bağlantı hatası.' +
            '</div>';
    }
}


/* =========================
   ÖDEME ONAYLA
========================= */

async function approvePayment(id){

    const key = getAdminKey();

    if(!key){
        return;
    }


    if(!confirm(
        "Bu ödemeyi onaylayıp kullanıcının bakiyesine eklemek istiyor musun?"
    )){
        return;
    }


    try{

        const response = await fetch(
            API + "/api/admin/payment/" +
            id +
            "/approve",
            {
                method:"POST",

                headers:{
                    "X-Admin-Key":key
                }
            }
        );


        const data =
            await response.json();


        if(response.status === 403){

            sessionStorage.removeItem(
                "ra_admin_key"
            );

            adminKey = "";

            alert("Admin anahtarı yanlış.");

            return;
        }


        if(!response.ok || !data.success){

            alert(
                data.error ||
                "Ödeme onaylanamadı."
            );

            return;
        }


        alert(
            "Ödeme onaylandı.\n\n" +
            "Yeni bakiye: " +
            Number(data.balance).toFixed(2) +
            " USDT"
        );


        loadPayments();


    }catch(error){

        alert(
            "Sunucu bağlantı hatası."
        );
    }
}


/* =========================
   ÖDEME REDDET
========================= */

async function rejectPayment(id){

    const key = getAdminKey();

    if(!key){
        return;
    }


    if(!confirm(
        "Bu ödeme bildirimini reddetmek istiyor musun?"
    )){
        return;
    }


    try{

        const response = await fetch(
            API + "/api/admin/payment/" +
            id +
            "/reject",
            {
                method:"POST",

                headers:{
                    "X-Admin-Key":key
                }
            }
        );


        const data =
            await response.json();


        if(response.status === 403){

            sessionStorage.removeItem(
                "ra_admin_key"
            );

            adminKey = "";

            alert("Admin anahtarı yanlış.");

            return;
        }


        if(!response.ok || !data.success){

            alert(
                data.error ||
                "Ödeme reddedilemedi."
            );

            return;
        }


        alert(
            "Ödeme bildirimi reddedildi."
        );


        loadPayments();


    }catch(error){

        alert(
            "Sunucu bağlantı hatası."
        );
    }
}



/* =========================
   SİPARİŞLERİ GETİR
========================= */

async function loadOrders(){
    const box=document.getElementById("orders");
    const key=getAdminKey();
    if(!key){box.innerHTML='<div class="empty error">İşlem iptal edildi.</div>';return;}
    box.innerHTML='<div class="empty">Siparişler yükleniyor...</div>';
    try{
        const response=await fetch(API+"/api/admin/orders",{method:"GET",headers:{"X-Admin-Key":key}});
        const data=await response.json();
        if(response.status===403){sessionStorage.removeItem("ra_admin_key");adminKey="";box.innerHTML='<div class="empty error">Admin anahtarı yanlış.</div>';return;}
        if(!response.ok||!data.success){box.innerHTML='<div class="empty error">'+(data.error||"Siparişler alınamadı.")+'</div>';return;}
        const orders=(data.orders||[]).filter(order=>order.status!=="Tamamlandı");
        if(!orders.length){box.innerHTML='<div class="empty">Henüz sipariş yok.</div>';return;}
        box.innerHTML=orders.map(order=>`
            <div class="order-item">
                <div><div class="order-label">SİPARİŞ ID</div><div class="order-value">#${order.id}</div></div>
                <div><div class="order-label">TELEGRAM ID</div><div class="order-value">${order.telegram_id}</div></div>
                <div><div class="order-label">KATEGORİ</div><div class="order-value">${order.category||"-"}</div></div>
                <div><div class="order-label">SERVİS</div><div class="order-value">${order.service||"-"}</div></div>
                <div><div class="order-label">LİNK</div><div class="order-value">${order.link||"-"}</div></div>
                <div><div class="order-label">MİKTAR</div><div class="order-value">${Number(order.quantity||0).toLocaleString("tr-TR")}</div></div>
                <div><div class="order-label">TUTAR</div><div class="order-value">${Number(order.price||0).toFixed(2)} USDT</div></div>
                <div><div class="order-label">TARİH</div><div class="order-value">${order.created_at||"-"}</div></div>
                <div><div class="order-label">DURUM</div><div class="order-status">${order.status||"Bekliyor"}</div></div>
                <div class="order-status-buttons">
                    <button class="status-processing" onclick="updateOrderStatus(${order.id},'İşleniyor')">İŞLENİYOR</button>
                    <button class="status-done" onclick="updateOrderStatus(${order.id},'Tamamlandı')">TAMAMLANDI</button>
                    <button class="status-cancel" onclick="updateOrderStatus(${order.id},'İptal')">İPTAL</button>
                    <button onclick="updateOrderStatus(${order.id},'Bekliyor')">BEKLİYOR</button>
                </div>
            </div>
        `).join("");
    }catch(error){box.innerHTML='<div class="empty error">Sunucu bağlantı hatası.</div>';}
}

async function updateOrderStatus(id,status){
    const key=getAdminKey();
    if(!key)return;
    try{
        const response=await fetch(API+"/api/admin/order/"+id+"/status",{
            method:"POST",
            headers:{"Content-Type":"application/json","X-Admin-Key":key},
            body:JSON.stringify({status:status})
        });
        const data=await response.json();
        if(response.status===403){sessionStorage.removeItem("ra_admin_key");adminKey="";alert("Admin anahtarı yanlış.");return;}
        if(!response.ok||!data.success){alert(data.error||"Sipariş durumu değiştirilemedi.");return;}
        if(status === "Tamamlandı"){
            alert("Sipariş tamamlandı ve admin panelinden kaldırıldı.");
        }
        loadOrders();
    }catch(error){alert("Sunucu bağlantı hatası.");}
}

</script>

</body>
</html>
